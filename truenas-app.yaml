# TrueNAS SCALE -> Apps -> Discover Apps -> menu -> Install via YAML
# Replace andymcschopf below with your GitHub username (lowercase recommended).
services:
  aoostar-truenas-lcd:
    image: ghcr.io/andymcschopf/aoostar-truenas-lcd:latest
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - aoostar-config:/app/cfg
      - /sys/class/net:/sys/class/net:ro
    environment:
      TZ: Europe/Berlin
      PYTHONUNBUFFERED: "1"
      TRUENAS_HOST: "127.0.0.1"
      TRUENAS_API_USER: ""
      TRUENAS_API_KEY: ""
      TRUENAS_VERIFY_TLS: "false"
      TRUENAS_NET_IFACE: ""
      REFRESH_SECONDS: "5"
volumes:
  aoostar-config:


