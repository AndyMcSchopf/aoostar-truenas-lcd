<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOOSTAR LCD Editor</title><link rel="stylesheet" href="/static/editor.css?v=0.8.13"><link rel="stylesheet" href="/static/true-lcd-preview.css">
</head><body><header><b>AOOSTAR / TRUESTARMAX</b><span>LCARS EDITOR · 960 × 376 · v0.9.0</span></header><main><aside><section><b>PANELS</b><div id="panels"></div><button id="addPanel">+ PANEL</button></section><section><b>ELEMENTE</b><div id="palette"></div></section><section class="sensorsec"><b>SENSOREN</b><input id="search" placeholder="Sensor suchen..."><div id="sensors"></div></section></aside><div class="center"><section class="toolbar"><input id="panelName"><label>Paneldauer (leer = Standard) <input id="duration" type="number" min="1" max="3600" placeholder="Standard"></label><label>Standarddauer (s) <input id="defaultDuration" type="number" min="1" max="3600" value="6"></label><span id="rotationTotal"></span><button id="dupPanel">DUPLIZIEREN</button><button id="delPanel">LÖSCHEN</button><button id="leftPanel">←</button><button id="rightPanel">→</button></section><div id="viewport"><div id="canvas"></div></div><section class="imagebar"><button id="save">SPEICHERN</button><button id="upload">BILD HOCHLADEN</button><input id="file" type="file" accept="image/*" hidden><button id="imgMode">BILDPOSITION: AUS</button><button id="removeBg">BILD ENTFERNEN</button><label>Modus <select id="fit"><option value="cover">AUSFÜLLEN</option><option value="contain">EINPASSEN</option><option value="center">ORIGINAL</option></select></label><label>Zoom <input id="zoom" type="number" step=".05" min=".25" max="4"></label><label>X <input id="imgX" type="number"></label><label>Y <input id="imgY" type="number"></label></section></div><aside class="right"><section><b>DESIGN</b><select id="theme"></select><label><input id="snap" type="checkbox" checked> 10px Raster</label></section><section><b>EIGENSCHAFTEN</b><div id="inspector">Element auswählen.</div></section><section class="images"><b>BILDER</b><div id="images"></div></section><section class="lcd"><b>LCD</b><div id="status">Bereit.</div><button id="preview">LCD-VORSCHAU ERZEUGEN</button><button id="activate">AUF LCD AKTIVIEREN</button><div id="historyInfo"></div></section></aside></main><script src="/static/layout-model.js"></script>
<script src="/static/layout-v6.js"></script><script src="/static/editor.js?v=0.8.13"></script><script src="/static/renderer-v5.js?v=0.8.14"></script><script src="/static/true-lcd-preview.js"></script>

<script>
document.addEventListener("DOMContentLoaded",function(){
 if(document.getElementById("lcd-preview-slot"))return;
 const canvas=document.querySelector("#canvas,.canvas,.panel-canvas,#preview,.preview");
 if(!canvas){console.error("AOOSTAR: editor canvas not found");return;}
 let node=canvas,grid=null,center=null;
 while(node.parentElement){
   const p=node.parentElement,cs=getComputedStyle(p);
   if(cs.display==="grid" && cs.gridTemplateColumns.split(" ").length>=3){
     grid=p;
     center=node;
     while(center.parentElement!==grid)center=center.parentElement;
     break;
   }
   node=p;
 }
 if(!grid||!center){console.error("AOOSTAR: center editor column not found");return;}
 const slot=document.createElement("div");
 slot.id="lcd-preview-slot";
 center.appendChild(slot);
});
</script>
</body></html>
